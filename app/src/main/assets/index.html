<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Videos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .logo-loader {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            animation: pulse 2s ease-in-out infinite;
            letter-spacing: 2px;
        }

        .logo-loader .red {
            color: #EF4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .header {
            background-color: #000;
            padding: 0.75rem 2rem;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .logo .x {
            color: #EF4444;
        }

        .header-nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-link:hover {
            color: #fff;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: #1a1a1a;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            width: 300px;
        }

        .search-bar input {
            background: none;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: #666;
        }

        .premium-btn {
            background-color: #EF4444;
            color: #fff;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }

        .premium-btn:hover {
            background-color: #dc2626;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .categories {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .category-btn {
            background-color: #1a1a1a;
            color: #9ca3af;
            padding: 0.5rem 1.25rem;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            border: none;
            transition: all 0.3s;
        }

        .category-btn:hover,
        .category-btn.active {
            background-color: #EF4444;
            color: #fff;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .video-card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .video-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
        }

        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .video-quality {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #EF4444;
        }

        .video-info {
            padding: 0 4px;
        }

        .video-title {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #666;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: #1a1a1a;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(239, 68, 68, 0.3);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.75rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background-color: #EF4444;
            color: #fff;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .upi-payment-container {
            background-color: #0a0a0a;
            border-radius: 12px;
            padding: 2rem;
            margin-top: 1.5rem;
            text-align: center;
        }

        .upi-icon {
            font-size: 4rem;
            color: #EF4444;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .upi-title {
            font-size: 1.5rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .price-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .price {
            font-size: 2.5rem;
            color: #EF4444;
            font-weight: bold;
        }

        .duration {
            font-size: 1.2rem;
            color: #d1d5db;
            margin-left: 1rem;
        }

        .benefits {
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .benefits-title {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 1rem;
            text-align: center;
        }

        .benefits-list {
            list-style: none;
        }

        .benefits-list li {
            color: #d1d5db;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
        }

        .benefits-list li:before {
            content: "✓";
            color: #EF4444;
            font-weight: bold;
            margin-right: 0.75rem;
            font-size: 1.2rem;
        }

        .upi-instructions {
            margin-bottom: 2rem;
            color: #d1d5db;
            line-height: 1.5;
            font-size: 1.1rem;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background-color: #EF4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-left: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .special-offer {
            background: linear-gradient(135deg, #EF4444 0%, #dc2626 100%);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            position: relative;
            overflow: hidden;
        }

        .special-offer:before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            width: 30px;
            height: 30px;
            background-color: #fff;
            transform: rotate(45deg);
        }

        .special-offer:after {
            content: "LIMITED";
            position: absolute;
            top: 5px;
            left: -5px;
            font-size: 0.5rem;
            font-weight: bold;
            color: #EF4444;
            transform: rotate(-45deg);
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.75rem 1rem;
            }

            .header-nav {
                gap: 1rem;
            }

            .search-bar {
                display: none;
            }

            .container {
                padding: 1rem;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>

        // Initialize video grid

        // Close modal when clicking outside
        document.getElementById('paymentModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('paymentModal')) {

            }
